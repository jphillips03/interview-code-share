# This workflow will run scripts to generate typedoc JSON, parse the JSON and
# generate markdown needed for documentation app; as well as build and deploy
# documentation app to github pages

name: Build and Deploy to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # Crucial: Gives the runner permission to write files to the gh-pages branch

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  setup_pages:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v3

      # Step 1: Checkout source code repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js runtime environment match
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Step 3: Install all project workspace dependencies
      - name: Install Dependencies
        run: npm ci

      # build and upload documentation project
      - name: Build Angular Application
        run: npx ng build --configuration production --base-href "https://jphillips03.github.io/interview-code-share/"
  
  # deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [setup_pages]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4